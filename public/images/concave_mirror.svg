<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="440" height="280" fill="#f8fafc" rx="12"/>
  <!-- Title -->
  <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">Concave Mirror — Object between P and F</text>
  <!-- Principal axis -->
  <line x1="20" y1="145" x2="420" y2="145" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Concave mirror arc (circle centre at C=(155,145), R=160 → P=(315,145)) -->
  <!-- Arc endpoints at y=65 & y=225: x=155+sqrt(160²-80²)=155+138.6≈294 -->
  <path d="M 294 65 A 160 160 0 0 1 294 225" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="297" y1="73"  x2="313" y2="85"  stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="306" y1="99"  x2="322" y2="111" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="314" y1="125" x2="328" y2="137" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="315" y1="152" x2="329" y2="164" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="310" y1="179" x2="324" y2="191" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="299" y1="205" x2="313" y2="217" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Key points -->
  <circle cx="155" cy="145" r="5" fill="#10b981"/>
  <text x="147" y="167" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">C</text>
  <circle cx="235" cy="145" r="5" fill="#ef4444"/>
  <text x="227" y="167" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">F</text>
  <circle cx="315" cy="145" r="4" fill="#334155"/>
  <text x="307" y="167" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">P</text>

  <!-- Object between P and F at x=268 -->
  <line x1="268" y1="145" x2="268" y2="98" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <polygon points="268,98 261,114 275,114" fill="#3b82f6"/>
  <text x="240" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#3b82f6">Object</text>

  <!-- Diverging rays after reflection -->
  <line x1="268" y1="98" x2="294" y2="98" stroke="#6366f1" stroke-width="1.8"/>
  <line x1="294" y1="98" x2="235" y2="145" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="235" y1="145" x2="110" y2="200" stroke="#6366f1" stroke-width="1.8"/>

  <line x1="268" y1="98" x2="294" y2="126" stroke="#f97316" stroke-width="1.8"/>
  <line x1="294" y1="126" x2="130" y2="210" stroke="#f97316" stroke-width="1.8"/>

  <!-- Virtual image behind mirror (erect, magnified) -->
  <line x1="370" y1="145" x2="370" y2="38" stroke="#a78bfa" stroke-width="3" stroke-dasharray="5,3"/>
  <polygon points="370,38 363,56 377,56" fill="#a78bfa"/>
  <text x="325" y="30" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a78bfa">Virtual Image</text>
  <text x="320" y="45" font-family="sans-serif" font-size="10" fill="#a78bfa">Erect · Magnified</text>

  <text x="20" y="260" font-family="sans-serif" font-size="11" fill="#334155">Result: Virtual, Erect, Magnified (behind mirror) ✓</text>
</svg>
