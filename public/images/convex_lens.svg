<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8fafc" />
  <!-- Principal Axis -->
  <line x1="20" y1="150" x2="380" y2="150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Convex Lens -->
  <path d="M 200 30 C 240 100 240 200 200 270 C 160 200 160 100 200 30" fill="rgba(56, 189, 248, 0.2)" stroke="#0ea5e9" stroke-width="2" />
  <line x1="200" y1="30" x2="200" y2="270" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Points -->
  <circle cx="200" cy="150" r="4" fill="#ef4444" />
  <text x="205" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">O</text>
  
  <circle cx="120" cy="150" r="4" fill="#3b82f6" />
  <text x="110" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">F1</text>
  
  <circle cx="40" cy="150" r="4" fill="#10b981" />
  <text x="30" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">2F1</text>
  
  <circle cx="280" cy="150" r="4" fill="#3b82f6" />
  <text x="275" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3b82f6">F2</text>
  
  <circle cx="360" cy="150" r="4" fill="#10b981" />
  <text x="350" y="170" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">2F2</text>

  <!-- Object at 2F1 -->
  <line x1="40" y1="150" x2="40" y2="80" stroke="#f59e0b" stroke-width="4" />
  <polygon points="40,70 35,85 45,85" fill="#f59e0b" />
  
  <!-- Image at 2F2 -->
  <line x1="360" y1="150" x2="360" y2="220" stroke="#f59e0b" stroke-width="4" />
  <polygon points="360,230 355,215 365,215" fill="#f59e0b" />

  <!-- Rays -->
  <!-- Parallel ray -->
  <line x1="40" y1="80" x2="200" y2="80" stroke="#ec4899" stroke-width="2" />
  <polygon points="120,76 130,80 120,84" fill="#ec4899" />
  
  <!-- Refracted ray passing through F2 -->
  <line x1="200" y1="80" x2="360" y2="220" stroke="#ec4899" stroke-width="2" />
  <polygon points="280,145 288,157 278,160" fill="#ec4899" />

  <!-- Ray passing through Optical Center O -->
  <line x1="40" y1="80" x2="360" y2="220" stroke="#ec4899" stroke-width="2" />
</svg>
