<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <!--
    Explanation: Refraction causes pencil to appear bent.
    Water surface at y=145 (horizontal interface).
    Real pencil tip at (190, 220) in water.
    Refraction point at (250, 145) on the surface.
    Observer at (370, 70).

    Ray in water: (190,220) → (250,145)
      dx=60, dy=-75 → slope=-75/60=-1.25
      angle with vertical normal ≈ arctan(60/75) = 38.7° (angle of incidence)

    Refracted ray in air: (250,145) → (370,70)
      dx=120, dy=-75 → slope=-75/120=-0.625
      angle with vertical normal ≈ arctan(120/75) = 58° (angle of refraction > angle of incidence ✓ rarer medium)

    Apparent tip: extend refracted ray backward from (250,145) with same slope (-0.625)
      At x=190: y = 145 + (190-250)*(-0.625) = 145 + (-60)*(-0.625) = 145+37.5 = 182.5 ≈ 183
      Apparent tip = (190, 183) — higher than real tip at (190,220) → pencil appears shorter/bent!
  -->
  <rect width="440" height="280" fill="#f8fafc" rx="12"/>

  <!-- Water fill -->
  <rect x="20" y="145" width="400" height="110" rx="0" fill="rgba(56,189,248,0.15)"/>
  <!-- Air/Water interface -->
  <line x1="20" y1="145" x2="420" y2="145" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="25" y="138" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">Air (rarer medium)</text>
  <text x="25" y="165" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0ea5e9">Water (denser medium)</text>

  <!-- Normal at refraction point (250,145) -->
  <line x1="250" y1="60" x2="250" y2="230" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="254" y="75" font-family="sans-serif" font-size="10" fill="#64748b">Normal</text>

  <!-- Real pencil body in water (real position) -->
  <line x1="200" y1="145" x2="185" y2="245" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <polygon points="183,245 192,245 187,258" fill="#d97706"/>
  <!-- Pencil body above water -->
  <line x1="370" y1="70" x2="200" y2="145" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>

  <!-- Real pencil tip marker -->
  <circle cx="187" cy="250" r="4" fill="#ef4444"/>
  <text x="155" y="265" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444">Real tip</text>

  <!-- RAY from real tip (187,250) → refraction point (250,145) [in water] -->
  <line x1="187" y1="250" x2="250" y2="145" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="250,145 237,155 244,168" fill="#f97316"/>

  <!-- Refracted ray in air (250,145) → observer (370,70) -->
  <line x1="250" y1="145" x2="370" y2="70" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="370,70 354,78 361,91" fill="#f97316"/>

  <!-- Apparent (virtual) ray: extension of refracted ray downward into water (dashed) -->
  <!-- Slope of refracted ray = (70-145)/(370-250) = -75/120 = -0.625 -->
  <!-- Going backward from (250,145): at x=187, y=145+(187-250)*(-0.625)=145+39.4=184.4 ≈ 184 -->
  <line x1="250" y1="145" x2="187" y2="184" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Apparent tip -->
  <circle cx="187" cy="184" r="5" fill="#a78bfa"/>
  <text x="110" y="183" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a78bfa">Apparent tip</text>
  <text x="100" y="196" font-family="sans-serif" font-size="10" fill="#a78bfa">(what observer sees)</text>

  <!-- Observer eye -->
  <ellipse cx="390" cy="68" rx="18" ry="12" fill="white" stroke="#334155" stroke-width="2"/>
  <circle cx="390" cy="68" r="6" fill="#1e40af"/>
  <circle cx="393" cy="65" r="1.5" fill="white"/>
  <text x="390" y="54" font-family="sans-serif" font-size="10" fill="#334155" text-anchor="middle">Eye</text>

  <!-- Angle labels -->
  <!-- Angle of incidence arc (in water side) -->
  <path d="M 250 165 A 20 20 0 0 0 237 158" fill="none" stroke="#f97316" stroke-width="1.5"/>
  <text x="215" y="175" font-family="sans-serif" font-size="9" fill="#f97316">i</text>

  <!-- Angle of refraction arc (in air side) -->
  <path d="M 250 125 A 20 20 0 0 1 268 132" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="268" y="122" font-family="sans-serif" font-size="9" fill="#a78bfa">r &gt; i</text>

  <!-- Result text -->
  <text x="20" y="260" font-family="sans-serif" font-size="10" fill="#334155">
    Light bends AWAY from normal going into rarer medium → pencil appears bent ✓ (Refraction)
  </text>

  <!-- Legend -->
  <line x1="20" y1="273" x2="35" y2="273" stroke="#f97316" stroke-width="2"/>
  <text x="38" y="277" font-family="sans-serif" font-size="9" fill="#f97316">Actual light path</text>
  <line x1="160" y1="273" x2="175" y2="273" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="178" y="277" font-family="sans-serif" font-size="9" fill="#a78bfa">Apparent ray (traced back by eye)</text>
</svg>
