<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <!--
    Question: A pencil in water appears bent. Shows the visual phenomenon, no explanation.
    Glass container, water, pencil appearing bent at the water surface.
  -->
  <rect width="440" height="280" fill="#f8fafc" rx="12"/>

  <!-- Glass container (outline) -->
  <rect x="130" y="55" width="200" height="190" rx="6" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <!-- Water fill (light blue) inside glass, from y=145 to bottom -->
  <rect x="132" y="145" width="196" height="98" rx="0" fill="rgba(56,189,248,0.25)"/>
  <!-- Water surface line -->
  <line x1="132" y1="145" x2="328" y2="145" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="334" y="149" font-family="sans-serif" font-size="11" fill="#0ea5e9" font-weight="bold">Water</text>

  <!-- Glass bottom -->
  <rect x="130" y="240" width="200" height="5" rx="3" fill="#94a3b8"/>

  <!-- === PENCIL === -->
  <!-- Body above water: from (300,55) to (245,145) -->
  <!-- Yellow pencil body (trapezoid shape) -->
  <polygon points="295,58 305,58 248,145 238,145" fill="#fbbf24"/>
  <!-- Pink eraser at top -->
  <rect x="290" y="50" width="15" height="12" rx="3" fill="#f9a8d4"/>
  <!-- Pencil tip (below water at apparent bent position) -->
  <!-- Real pencil continues: from (243,145) to (197,220) [same angle] -->
  <!-- Apparent (bent): from (243,145) to (215,200) [appears to bend] -->

  <!-- Pencil body BELOW water (appears bent = different angle) -->
  <polygon points="248,145 238,145 210,220 220,220" fill="#fbbf24"/>
  <!-- Pencil tip cone -->
  <polygon points="210,220 220,220 215,235" fill="#d97706"/>

  <!-- Dotted line showing real position (straight continuation) -->
  <line x1="243" y1="145" x2="195" y2="240" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>

  <!-- Observer eye (top left) -->
  <ellipse cx="90" cy="80" rx="20" ry="13" fill="white" stroke="#334155" stroke-width="2"/>
  <circle cx="90" cy="80" r="7" fill="#1e40af"/>
  <circle cx="93" cy="77" r="2" fill="white"/>
  <text x="55" y="108" font-family="sans-serif" font-size="11" fill="#334155">Observer</text>

  <!-- Light ray from apparent pencil tip to eye -->
  <line x1="215" y1="145" x2="90" y2="83" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>

  <!-- Question mark -->
  <text x="355" y="185" font-family="sans-serif" font-size="36" font-weight="bold" fill="#f59e0b">?</text>
  <text x="342" y="225" font-family="sans-serif" font-size="11" fill="#6366f1">Why bent?</text>

  <!-- Air label -->
  <text x="138" y="130" font-family="sans-serif" font-size="11" fill="#64748b">Air</text>
  <text x="138" y="200" font-family="sans-serif" font-size="11" fill="#0ea5e9">Water</text>
</svg>
