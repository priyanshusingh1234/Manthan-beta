<svg width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="260" fill="#f8fafc" rx="12"/>
  <!-- Light ray hitting mirror (both in and out at 60°) -->
  <line x1="200" y1="20" x2="200" y2="240" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="20" x2="215" y2="35" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="50" x2="215" y2="65" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="80" x2="215" y2="95" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="110" x2="215" y2="125" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="140" x2="215" y2="155" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="170" x2="215" y2="185" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="200" y1="200" x2="215" y2="215" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Normal -->
  <line x1="200" y1="30" x2="200" y2="230" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Incident ray -->
  <line x1="60" y1="40" x2="200" y2="130" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="200,130 185,120 190,138" fill="#6366f1"/>
  <!-- Reflected ray -->
  <line x1="200" y1="130" x2="60" y2="220" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="60,220 75,205 68,223" fill="#ef4444"/>
  <!-- Angle arc i -->
  <path d="M 200 100 A 30 30 0 0 0 174 110" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <text x="150" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6366f1">i=30°</text>
  <!-- Angle arc r -->
  <path d="M 174 152 A 30 30 0 0 0 200 162" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="148" y="168" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ef4444">r=30°</text>
  <!-- Total angle arc -->
  <path d="M 88 62 A 120 120 0 0 1 88 200" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="30" y="138" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">60°</text>
  <text x="8" y="155" font-family="sans-serif" font-size="10" fill="#10b981">total</text>
</svg>
