<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <style>
    .character { transform-origin: center; }
    .limb { transition: transform 0.3s ease-in-out; }
    
    /* Subtle default floating/breathing animation */
    @keyframes bounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .bouncing { animation: bounce 2s infinite ease-in-out; }
  </style>

  <g id="boy1" class="character" transform="translate(200, 70)">
    
    <g class="bouncing">
      <g id="b1-arm-l" class="limb" style="transform-origin: 10px 110px;">
        <rect x="-5" y="100" width="16" height="50" rx="8" fill="#FF7B7B" />
        <circle cx="3" cy="150" r="10" fill="#FFDFC4" /> </g>

      <g id="b1-leg-l" class="limb" style="transform-origin: 25px 170px;">
        <rect x="15" y="160" width="18" height="40" rx="4" fill="#3A86FF" />
        <rect x="10" y="195" width="28" height="15" rx="7" fill="#FFD166" /> </g>

      <g id="b1-leg-r" class="limb" style="transform-origin: 55px 170px;">
        <rect x="45" y="160" width="18" height="40" rx="4" fill="#4A90E2" />
        <rect x="45" y="195" width="28" height="15" rx="7" fill="#FFBE0B" /> </g>

      <g id="b1-torso" class="limb" style="transform-origin: 40px 160px;">
        <rect x="15" y="95" width="50" height="70" rx="20" fill="#FF7B7B" />
        <path d="M 15 130 L 65 130 L 65 165 C 65 175, 15 175, 15 165 Z" fill="#4A90E2" />
        <rect x="22" y="100" width="8" height="35" rx="4" fill="#4A90E2" /> <rect x="50" y="100" width="8" height="35" rx="4" fill="#4A90E2" /> <circle cx="26" cy="130" r="4" fill="#FFF" /> <circle cx="54" cy="130" r="4" fill="#FFF" /> </g>

      <g id="b1-head" class="limb" style="transform-origin: 40px 95px;">
        <rect x="33" y="85" width="14" height="15" fill="#FFDFC4" />
        <rect x="0" y="10" width="80" height="75" rx="35" fill="#FFDFC4" />
        <path d="M 0 45 C -10 -10, 90 -10, 80 45 Z" fill="#FFB347" />
        <circle cx="22" cy="50" r="7" fill="#333" />
        <circle cx="24" cy="48" r="2" fill="#FFF" /> <circle cx="58" cy="50" r="7" fill="#333" />
        <circle cx="60" cy="48" r="2" fill="#FFF" /> <ellipse cx="12" cy="60" rx="6" ry="3" fill="#FF9E9E" opacity="0.5" />
        <ellipse cx="68" cy="60" rx="6" ry="3" fill="#FF9E9E" opacity="0.5" />
        <path d="M 32 62 Q 40 75 48 62 Z" fill="#FF7B7B" stroke="#333" stroke-width="2" stroke-linejoin="round" />
        <path d="M -5 35 Q 20 0 45 25 Q 60 5 85 30 Q 60 -15 20 -10 Z" fill="#FF9F1C" />
      </g>

      <g id="b1-arm-r" class="limb" style="transform-origin: 70px 110px;">
        <rect x="65" y="100" width="16" height="50" rx="8" fill="#FF7B7B" />
        <circle cx="73" cy="150" r="10" fill="#FFDFC4" /> </g>
    </g>
  </g>

  <g id="boy2" class="character" transform="translate(500, 70)">
    
    <g class="bouncing" style="animation-delay: -1s;"> <g id="b2-arm-l" class="limb" style="transform-origin: 5px 115px;">
        <rect x="-10" y="105" width="22" height="60" rx="11" fill="#38B09D" />
      </g>

      <g id="b2-leg-l" class="limb" style="transform-origin: 25px 170px;">
        <rect x="15" y="160" width="16" height="40" rx="4" fill="#2C3E50" />
        <path d="M 10 200 L 35 200 C 35 190, 10 190, 10 200 Z" fill="#ECF0F1" /> 
      </g>

      <g id="b2-leg-r" class="limb" style="transform-origin: 55px 170px;">
        <rect x="45" y="160" width="16" height="40" rx="4" fill="#34495E" />
        <path d="M 40 200 L 65 200 C 65 190, 40 190, 40 200 Z" fill="#FFF" /> 
      </g>

      <g id="b2-torso" class="limb" style="transform-origin: 40px 160px;">
        <rect x="10" y="100" width="60" height="65" rx="25" fill="#48C9B0" />
        <rect x="25" y="95" width="30" height="15" rx="7" fill="#38B09D" />
      </g>

      <g id="b2-head" class="limb" style="transform-origin: 40px 95px;">
        <rect x="33" y="85" width="14" height="15" fill="#E8B89C" />
        <rect x="0" y="15" width="80" height="75" rx="35" fill="#E8B89C" />
        
        <path d="M 18 52 Q 24 48 30 52" stroke="#333" stroke-width="3" stroke-linecap="round" fill="none" />
        <path d="M 50 52 Q 56 48 62 52" stroke="#333" stroke-width="3" stroke-linecap="round" fill="none" />
        
        <ellipse cx="15" cy="58" rx="7" ry="4" fill="#E74C3C" opacity="0.3" />
        <ellipse cx="65" cy="58" rx="7" ry="4" fill="#E74C3C" opacity="0.3" />
        
        <path d="M 38 65 L 42 65" stroke="#333" stroke-width="2" stroke-linecap="round" />

        <path d="M -5 30 C 5 60, 20 60, 25 30 Z" fill="#2C3E50" />
        <path d="M 85 30 C 75 60, 60 60, 55 30 Z" fill="#2C3E50" />
        <path d="M -5 35 Q 40 -30 85 35 Z" fill="#F39C12" />
        <rect x="-8" y="30" width="96" height="12" rx="6" fill="#E67E22" />
      </g>

      <g id="b2-arm-r" class="limb" style="transform-origin: 75px 115px;">
        <rect x="68" y="105" width="22" height="60" rx="11" fill="#48C9B0" />
      </g>
    </g>
  </g>
</svg>
